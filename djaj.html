        @media (max-width: 768px) { .site-logo { font-size: 28px; } .section-title { font-size: 24px; } .dishes-grid { grid-template-columns: 1fr; } .container { padding: 15px 10px; } .whatsapp-float { width: 55px; height: 55px; font-size: 26px; bottom: 18px; left: 18px; } .music-btn { width: 45px; height: 45px; font-size: 18px; bottom: 18px; right: 18px; } .back-to-top { width: 45px; height: 45px; font-size: 18px; bottom: 75px; right: 18px; } }

<script>
    // دالة بسيطة ومضمونة: تغيير الصورة الكبيرة فقط عند الضغط على الصورة المصغرة
    function changeMainImage(mainImageId, newImageSrc, clickedThumbnail) {
        // 1. تغيير الصورة الكبيرة
        document.getElementById(mainImageId).src = newImageSrc;

        // 2. إزالة التحديد (الحدود الذهبية) من جميع الصور المصغرة
        var parent = clickedThumbnail.parentElement;
        var thumbs = parent.getElementsByClassName('thumbnail-wrapper');
        for (var i = 0; i < thumbs.length; i++) {
            thumbs[i].classList.remove('active');
        }

        // 3. إضافة التحديد للصورة التي تم الضغط عليها
        clickedThumbnail.classList.add('active');
    }

    // سكريبت الموسيقى
    (function() { 
        var music = document.getElementById('bgMusic'); 
        var toggleBtn = document.getElementById('musicToggle'); 
        var icon = document.getElementById('musicIcon'); 
        var isPlaying = false; 
        document.addEventListener('click', function start() { 
            if (!isPlaying && music) { 
                music.volume = 0.3; 
                music.play().then(function() { isPlaying = true; icon.className = 'fas fa-volume-up'; }).catch(function() {}); 
            } 
            document.removeEventListener('click', start); 
        }, { once: true }); 
        if (toggleBtn) { 
            toggleBtn.addEventListener('click', function(e) { 
                e.stopPropagation(); 
                if (music.paused) { music.play(); isPlaying = true; icon.className = 'fas fa-volume-up'; } 
                else { music.pause(); isPlaying = false; icon.className = 'fas fa-volume-mute'; } 
            }); 
        } 
    })();

    // زر العودة إلى الأعلى
    (function() {
        var backToTopBtn = document.getElementById('backToTop');
        if (backToTopBtn) {
            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 300) {
                    backToTopBtn.classList.add('show');
                } else {
                    backToTopBtn.classList.remove('show');
                }
            });
            backToTopBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    })();
</script>
